<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>dredd doctors — the board</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1410;
    --panel: #0f1e17;
    --border: #2a4a3a;
    --green: #7fff5c;
    --green-dim: #3d9e2f;
    --text: #d8f0d8;
    --text-dim: #7a9a85;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #10241a 0%, #060d09 70%);
    color: var(--text);
    font-family: 'Courier Prime', monospace;
    padding: 40px 20px 80px;
  }
  .wrap { max-width: 700px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 32px; }
  .header .mascot {
    width: 140px; height: 140px; margin: 0 auto 16px;
    border-radius: 50%; overflow: hidden;
    border: 2px solid var(--green);
    box-shadow: 0 0 30px rgba(127,255,92,0.3);
  }
  .header .mascot img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
  .header h1 {
    font-family: 'Special Elite', monospace;
    font-size: 36px; margin: 0; letter-spacing: 2px;
    color: var(--green); text-shadow: 0 0 18px rgba(127,255,92,0.5);
  }
  .header p { font-size: 13px; color: var(--text-dim); margin: 10px 0 0; letter-spacing: 0.5px; }
  .nav-links { margin-top: 10px; }
  .nav-links a { color: var(--green-dim); font-size: 12px; margin: 0 8px; text-decoration: none; }
  .nav-links a:hover { text-decoration: underline; }

  .section-label {
    display: flex; align-items: center; gap: 10px; justify-content: center;
    font-size: 12px; letter-spacing: 3px; color: var(--green-dim);
    text-transform: uppercase; margin: 28px 0 16px;
  }
  .section-label .line { flex: 1; max-width: 60px; height: 1px; background: var(--border); }
  .section-label .diamond { color: var(--green); font-size: 10px; }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 20px; position: relative;
  }
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border-color: var(--green); border-style: solid; opacity: 0.7;
  }
  .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 6px 0 0 0; }
  .panel::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 6px 0; }

  .panel input, .panel textarea {
    width: 100%; background: #071009; border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 14px; color: var(--text); font-family: 'Courier Prime', monospace; font-size: 14px;
    margin-bottom: 10px;
  }
  .panel textarea { resize: vertical; min-height: 80px; }
  .panel input::placeholder, .panel textarea::placeholder { color: #4a6a54; }
  .panel label {
    display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 0.5px;
  }
  .panel button {
    background: var(--green); color: #06180c; border: none; border-radius: 6px;
    padding: 12px 20px; font-family: 'Special Elite', monospace; font-size: 13px;
    letter-spacing: 1px; cursor: pointer; text-transform: uppercase; width: 100%;
  }
  .panel button:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }
  .status-msg { font-size: 12px; margin-top: 10px; line-height: 1.6; }
  .flag-ok { color: var(--green); }
  .flag-warn { color: #ffb347; }
  .flag-bad { color: #ff6b5c; }

  .experiment-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 12px; position: relative;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .experiment-card::before, .experiment-card::after {
    content: ""; position: absolute; width: 10px; height: 10px;
    border-color: var(--green-dim); border-style: solid;
  }
  .experiment-card::before { top: -1px; left: -1px; border-width: 1.5px 0 0 1.5px; border-radius: 6px 0 0 0; }
  .experiment-card::after { bottom: -1px; right: -1px; border-width: 0 1.5px 1.5px 0; border-radius: 0 0 6px 0; }

  .vote-btn {
    background: #071009; border: 1px solid var(--border); border-radius: 8px;
    color: var(--green); font-family: 'Special Elite', monospace; font-size: 13px;
    padding: 10px 12px; cursor: pointer; text-align: center; min-width: 54px; flex-shrink: 0;
  }
  .vote-btn .count { display: block; font-size: 16px; margin-bottom: 2px; }
  .vote-btn:hover { border-color: var(--green); }

  .experiment-info { flex: 1; }
  .experiment-info .title {
    font-family: 'Special Elite', monospace; font-size: 15px; color: var(--text); margin: 0 0 6px;
  }
  .experiment-info .desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin: 0 0 6px; }
  .experiment-info .submitter { font-size: 11px; color: var(--green-dim); }
  .shipped-badge {
    display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 4px;
    background: rgba(127,255,92,0.12); border: 1px solid var(--green-dim);
    font-size: 11px; color: var(--green); letter-spacing: 0.5px;
  }

  .empty-note { text-align: center; font-size: 13px; color: var(--text-dim); padding: 20px 0; }

  .footer-note {
    text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 36px;
    letter-spacing: 0.5px; padding-top: 16px; border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <div class="mascot"><img src="assets/base_char.png" alt="Dredd Doctors mascot"></div>
    <h1>DREDD DOCTOR BOARD</h1>
    <p>propose the next experiment. vote on what gets built. shipped ideas earn their creator 10 XRP.</p>
    <div class="nav-links">
      <a href="index.html">&larr; the file</a> | <a href="app.html">run diagnostics</a>
    </div>
  </div>

  <div class="section-label">
    <span class="line"></span>
    <span class="diamond">&#10022;</span>
    <span>become a dredd doctor</span>
    <span class="diamond">&#10022;</span>
    <span class="line"></span>
  </div>

  <div class="panel">
    <label>your wallet — hold at least 1 lab rat to unlock submissions</label>
    <input type="text" id="checkWalletInput" placeholder="rYourWalletAddress">
    <button onclick="checkEligibility()">check eligibility</button>
    <div class="status-msg" id="eligibilityStatus"></div>
  </div>

  <div class="panel" id="submitPanel" style="display: none;">
    <label>experiment title</label>
    <input type="text" id="expTitle" placeholder="e.g. rug-check for token/token pools">
    <label>describe the experiment</label>
    <textarea id="expDescription" placeholder="what should this tool do, and why does the community need it?"></textarea>
    <button onclick="submitExperiment()">submit experiment</button>
    <div class="status-msg" id="submitStatus"></div>
  </div>

  <div class="section-label">
    <span class="line"></span>
    <span class="diamond">&#10022;</span>
    <span>proposed experiments</span>
    <span class="diamond">&#10022;</span>
    <span class="line"></span>
  </div>

  <div id="experimentsList">
    <p class="empty-note">loading...</p>
  </div>

  <div class="footer-note">
    every experiment here came from the community. vote for what you want built next.
  </div>

</div>

<script>
  const API_BASE = 'https://lab-rats-backend-production.up.railway.app/api';
  let eligibleWallet = null;

  async function checkEligibility() {
    const wallet = document.getElementById('checkWalletInput').value.trim();
    const statusEl = document.getElementById('eligibilityStatus');
    if (!wallet || !wallet.startsWith('r')) {
      statusEl.innerHTML = '<span class="flag-warn">paste a valid wallet address first.</span>';
      return;
    }
    statusEl.innerHTML = '<span class="loading">checking...</span>';

    try {
      const res = await fetch(`${API_BASE}/dredd/check/${wallet}`);
      const data = await res.json();

      if (data.eligible) {
        eligibleWallet = wallet;
        statusEl.innerHTML = `<span class="flag-ok">verified — you hold a lab rat. submission form unlocked below.</span>`;
        document.getElementById('submitPanel').style.display = 'block';
      } else {
        statusEl.innerHTML = `<span class="flag-warn">${data.note || 'this wallet does not hold a lab rat yet.'}</span>`;
        document.getElementById('submitPanel').style.display = 'none';
      }
    } catch (e) {
      statusEl.innerHTML = '<span class="flag-bad">backend unreachable — try again shortly.</span>';
    }
  }

  async function submitExperiment() {
    const title = document.getElementById('expTitle').value.trim();
    const description = document.getElementById('expDescription').value.trim();
    const statusEl = document.getElementById('submitStatus');

    if (!title || !description) {
      statusEl.innerHTML = '<span class="flag-warn">fill in both the title and description.</span>';
      return;
    }
    statusEl.innerHTML = '<span class="loading">submitting...</span>';

    try {
      const res = await fetch(`${API_BASE}/dredd/submit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wallet: eligibleWallet, title, description }),
      });
      const data = await res.json();
      if (!res.ok) {
        statusEl.innerHTML = `<span class="flag-bad">${data.error}</span>`;
        return;
      }
      statusEl.innerHTML = '<span class="flag-ok">submitted. thanks for the experiment.</span>';
      document.getElementById('expTitle').value = '';
      document.getElementById('expDescription').value = '';
      loadExperiments();
    } catch (e) {
      statusEl.innerHTML = '<span class="flag-bad">backend unreachable — try again shortly.</span>';
    }
  }

  async function voteFor(experimentId, btnEl) {
    const wallet = prompt('paste your wallet to vote (one vote per wallet per experiment):');
    if (!wallet || !wallet.trim().startsWith('r')) return;

    try {
      const res = await fetch(`${API_BASE}/dredd/vote`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ experimentId, wallet: wallet.trim() }),
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error);
        return;
      }
      btnEl.querySelector('.count').textContent = data.upvotes;
    } catch (e) {
      alert('backend unreachable — try again shortly.');
    }
  }

  function truncate(wallet) {
    return wallet.length > 12 ? `${wallet.slice(0, 6)}...${wallet.slice(-4)}` : wallet;
  }

  async function loadExperiments() {
    const listEl = document.getElementById('experimentsList');
    try {
      const res = await fetch(`${API_BASE}/dredd/experiments`);
      const data = await res.json();

      if (!data.experiments || data.experiments.length === 0) {
        listEl.innerHTML = '<p class="empty-note">no experiments proposed yet — be the first.</p>';
        return;
      }

      listEl.innerHTML = data.experiments.map((exp) => `
        <div class="experiment-card">
          <div class="vote-btn" onclick="voteFor(${exp.id}, this)">
            <span class="count">${exp.upvotes}</span>votes
          </div>
          <div class="experiment-info">
            <p class="title">${exp.title}</p>
            <p class="desc">${exp.description}</p>
            <p class="submitter">proposed by ${truncate(exp.submitted_by)}</p>
            ${exp.shipped ? `<div class="shipped-badge">✅ shipped — ${exp.reward_xrp || 10} XRP awarded</div>` : ''}
          </div>
        </div>
      `).join('');
    } catch (e) {
      listEl.innerHTML = '<p class="empty-note">couldn\'t load the board — backend unreachable.</p>';
    }
  }

  loadExperiments();
</script>
</body>
</html>
